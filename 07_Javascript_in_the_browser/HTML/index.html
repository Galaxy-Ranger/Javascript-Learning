<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body>
    <div>
        <p class="directChild sibling decendent">Hello Surya</p>
        <span class="sibling decendent">Hello I'm Span Tag</span>
        <div class="sibling decendent">
            <h4 class="directChild decendent">I'm a h4 tag</h4>
        </div>
    </div>
    <div class="container">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">First</th>
                <th scope="col">Last</th>
                <th scope="col">Handle</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
            </tr>
            <tr>
                <th scope="row">2</th>
                <td>Jacob</td>
                <td>Thornton</td>
                <td>@fat</td>
            </tr>
            <tr>
                <th scope="row">3</th>
                <td colspan="2">Larry the Bird</td>
                <td>@twitter</td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav class="noChild"></nav>
